{% extends "base.html" %}
{% block title %}Вхід адміністратора — ПіцаДім{% endblock %}
{% block content %}
<section class="narrow">
    <h1>Вхід для адміністратора</h1>
    <form action="{{ url_for('login') }}" method="post" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Логін<input type="text" name="login" required></label>
        <label>Пароль<input type="password" name="password" required></label>
        <button class="button" type="submit">Увійти</button>
    </form>
</section>
{% endblock %}
